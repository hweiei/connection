name = "connection"
main = "worker/index.js"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# 静态资源: 构建产物 dist/ 由 Worker 托管
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ── 环境变量(非敏感,可写在这里)──────────────────────────
[vars]
MCP_URL = "https://affiliates-geek-roger-rides.trycloudflare.com/mcp"

# ── 敏感变量(不要写在这里!用命令行或控制台设置为 Secret)──
#   npx wrangler secret put MCP_PASSWORD      # OAuth 授权页密码
#   npx wrangler secret put MCP_TOKEN         # (可选)手动注入的 access_token,跳过自动登录
#
# 部署:
#   npm run build
#   npx wrangler deploy
#
# 部署后:
#   页面         https://connection.32024755.workers.dev
#   自动网关     https://connection.32024755.workers.dev/gateway        ← ⭐ AI 直接当 MCP 端点
#   网关状态     https://connection.32024755.workers.dev/gateway/health
#   透明中继     https://connection.32024755.workers.dev/__proxy?url=...
